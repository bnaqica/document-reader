plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.cloud.tools.jib' version '3.5.4'
    id 'com.diffplug.spotless' version '8.12.0'
}

group = 'com.bnaqica'
version = '0.0.1-SNAPSHOT'
description = 'document-reader'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // Neither is in Spring Boot's BOM. Spring AI 2.0.x is the line built against Spring Boot 4.1 (2.1 needs 4.2).
        mavenBom 'org.springframework.ai:spring-ai-bom:2.0.3'
        mavenBom 'software.amazon.awssdk:bom:2.59.6'
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    // springdoc isn't in Spring Boot's BOM
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql' // PGConnection, for the LISTEN connection
    // Starts compose.yaml during `./gradlew bootRun`; left out of the jar and the tests
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // OpenAI vision through Spring AI (version from the Spring AI BOM above)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    // S3 for the uploaded files and page images (version from the AWS SDK BOM above)
    // Synchronous calls only, on virtual threads: keep the Apache client and drop the Netty one the SDK also brings.
    // Java 25 no longer pins virtual threads in synchronized blocks, so Apache's blocking client suits them.
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:apache-client'
    // The libraries below aren't in Spring Boot's BOM, so each is pinned
    // Renders PDF pages to images
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    // ImageIO readers for TIFF, WEBP and JPEG (not in the Boot BOM, so pinned together)
    implementation 'com.twelvemonkeys.imageio:imageio-tiff:3.15.3'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
    // CMYK and ICC-profiled JPEGs, which the JDK's reader can't decode
    implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.15.3'
    // Detects an upload's real type from its bytes
    implementation 'org.apache.tika:tika-core:4.2.0'
    // Validates extracted data against each document type's JSON Schema; 3.x uses Jackson 3, like Spring Boot 4
    implementation 'com.networknt:json-schema-validator:3.0.9'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'golden' // real OpenAI calls; only goldenTest runs them
    }
    // Spring keeps each test configuration's context (with its pool and Hibernate model) cached for the whole run;
    // the 512 MB default ran out once WI-12 added its context
    maxHeapSize = '1g'
    finalizedBy tasks.named('jacocoTestReport')
}

// The golden suite: the synthetic fixtures through the real OpenAI model, printing accuracy and token totals.
// Needs OPENAI_API_KEY and costs real calls, so it is never part of `check` or `build`; run it by hand.
tasks.register('goldenTest', Test) {
    description = 'Measures accuracy and cost against the real OpenAI model (needs OPENAI_API_KEY).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'golden'
    }
    maxHeapSize = '1g'
    outputs.upToDateWhen { false } // a measurement, so never skipped as up to date
    testLogging {
        showStandardStreams = true // the results table is logged
    }
}

jacoco {
    toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

// `./gradlew build` fails on unformatted code; `./gradlew spotlessApply` fixes it
spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.103.0')
        removeUnusedImports()
    }
}

// `./gradlew bootRun` targets the local environment by default
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local')
}

// Set IMAGE_REGISTRY (for example ghcr.io/my-org) to push with `./gradlew jib`
def imageRegistry = providers.environmentVariable('IMAGE_REGISTRY').map { "${it}/" }.getOrElse('')

jib {
    // Keeps developmentOnly dependencies such as spring-boot-docker-compose out of the image
    configurationName = 'productionRuntimeClasspath'
    from {
        // Temurin 25 JRE plus ImageMagick and libheif, for HEIC uploads; see src/main/docker/base/Dockerfile
        // docker:// reads it from the local Docker daemon; pass -PbaseImage=<registry>/document-reader-base:1 to pull it
        image = project.findProperty('baseImage') ?: 'docker://document-reader-base:1'
    }
    to {
        image = "${imageRegistry}document-reader"
        tags = [project.version.toString(), 'latest']
    }
    container {
        mainClass = 'com.bnaqica.documentreader.DocumentReaderApplication'
        ports = ['8084']
        user = '1000:1000'
        jvmFlags = ['-XX:MaxRAMPercentage=75.0']
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}
