# Settings for running on a developer machine. This profile also turns off authentication.
spring:
  # During `./gradlew bootRun` the connection comes from compose.yaml and these values aren't used.
  # They apply when the application is started some other way against a Postgres on port 5432.
  datasource:
    url: jdbc:postgresql://localhost:5432/document_reader_db
    username: document_reader_local
    password: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/local-issuer   # required at startup, but unused with authentication off
  ai:
    openai:
      # From the OPENAI_API_KEY variable in your shell. It stays out of this file, which is committed.
      api-key: ${OPENAI_API_KEY}
# S3 goes to the LocalStack in the sibling local-docker repo. Create the bucket once:
#   awslocal s3 mb s3://document-reader-local
app:
  document-reader:
    s3:
      bucket: document-reader-local
      endpoint: http://localhost:4566
      path-style-access: true
      server-side-encryption: AES256   # LocalStack has no KMS
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
